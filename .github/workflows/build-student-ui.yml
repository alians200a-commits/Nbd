name: Build student app and check real navigation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  student-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out real React application
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free open-source dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and build app
        run: npm run build
      - name: Include linked learning pages in deployable build
        run: |
          mkdir -p dist/assets dist/data
          cp -R assets/. dist/assets/
          cp -R data/. dist/data/
          find . -maxdepth 1 -type f -name '*.html' ! -name 'index.html' ! -name 'admin.html' -exec cp {} dist/ \;
          # Only playback-ready voice is public; editing, imports and metadata are admin-only.
          rm -f dist/voice_production.html dist/audio-library.html
          rm -f dist/assets/nabd-voice-center.js dist/assets/nabd-ch1-audio.js dist/assets/nabd-voice-player.js
          rm -f dist/nabd-voice/manifest.json
          test ! -e dist/admin.html
          test ! -e dist/voice_production.html
          test ! -e dist/audio-library.html
          test ! -e dist/nabd-voice/manifest.json
          test -s dist/nabd-voice/neuron-baghdad-sulafat.wav
      - name: Check new student navigation and original illustrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          ui=Path('src/components/StudentShell.tsx').read_text(encoding='utf-8')
          home=Path('src/views/StudentHomeView.tsx').read_text(encoding='utf-8')
          chapters=Path('src/views/StudentChaptersView.tsx').read_text(encoding='utf-8')
          assert 'StudentShell' in app and 'StudentHomeView' in app and 'StudentChaptersView' in app
          assert 'student-mobile-nav' in ui and 'student-desktop-nav' in ui
          assert 'curriculum' in home and 'chapters' in chapters and 'lab' in chapters
          assert 'ministryExam' in app and 'voiceCoach' in app and 'organSim' in app
          art=['brain','books','microscope','heart','lungs','bone','eye',
               'graduate','trophy','intestine','arm','kidneys','dna','thyroid','cell-nuclei','nerve']
          for name in art:
              assert Path('dist/nabd-art/'+name+'.svg').is_file(),name
          for name in ('learn.html','simulations.html','exam-bank.html','materials.html'):
              assert Path('dist/'+name).is_file(),name
          assert not Path('dist/admin.html').exists(), 'Admin page leaked into public site'
          assert Path('dist/assets/nabd-learn.js').is_file()
          assert Path('dist/data/nabd-curriculum.js').is_file()
          print('React app, original artwork, core routes and legacy learning pages verified')
          PY
      - name: Upload deployable preview
        uses: actions/upload-artifact@v4
        with:
          name: nabd-student-ui-dist
          path: dist/
          retention-days: 7
      - name: Upload complete website to site-build branch in this GitHub repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/nabd-art/brain.svg
          touch dist/.nojekyll
          mkdir -p /tmp/nabd-site-publication
          cp -a dist/. /tmp/nabd-site-publication/
          cd /tmp/nabd-site-publication
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qb site-build
          git add -A
          git commit -qm "Publish NABD website from ${GITHUB_SHA}"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force destination HEAD:refs/heads/site-build
