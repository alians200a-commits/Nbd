name: Verify Ionic UI and teacher B playback
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/nabd-ionic.js
          node --check assets/nabd-voice-center.js
          node --check assets/nabd-voice-player.js
      - name: Verify app files and controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path("index.html").read_text(encoding="utf8")
          center=Path("voice_production.html").read_text(encoding="utf8")
          js=Path("assets/nabd-voice-center.js").read_text(encoding="utf8")
          player=Path("assets/nabd-voice-player.js").read_text(encoding="utf8")
          mainids=set(re.findall(r'id="([^"]+)"',app))
          studioids=set(re.findall(r'id="([^"]+)"',center))
          playerids=set(re.findall(r'\$\("([^"]+)"\)',player))
          studiojsids=set(re.findall(r'\$\("([^"]+)"\)',js))
          assert playerids <= mainids, f"Main UI missing: {playerids-mainids}"
          assert studiojsids <= studioids, f"Voice studio UI missing: {studiojsids-studioids}"
          assert Path("assets/healthicons-anatomy.svg").exists()
          assert 'href="voice_production.html"' in app
          assert 'assets/nabd-voice-player.js' in app
          assert 'speechSynthesis.speak' not in player + js
          assert 'new SpeechSynthesisUtterance' not in player + js
          print("Voice B-only UI files and controls verified")
          PY
