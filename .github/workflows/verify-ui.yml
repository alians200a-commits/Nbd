name: Verify open-source UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check assets/nabd-app.js
      - name: Validate local files and UI references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('assets/nabd-app.js').read_text(encoding='utf-8')
          icon=Path('assets/tabler-icons.svg').read_text(encoding='utf-8')
          ids=set(re.findall(r'id="([^"]+)"',html))
          used=set(re.findall(r'\$\("([^"]+)"\)',js))
          assert not used-ids, f"Missing UI IDs: {used-ids}"
          symbols=set(re.findall(r'<symbol id="ti-([^"]+)"',icon))
          refs=set(re.findall(r'#ti-([^"]+)',html))|set(re.findall(r'ico\("([^"]+)"\)',js))
          assert not refs-symbols, f"Missing original Tabler SVG symbols: {refs-symbols}"
          for fn in ('assets/nabd-tabler-config.css','assets/nabd-app.js','assets/tabler-icons.svg','OPEN_SOURCE_SOURCES.md'):
              assert Path(fn).is_file(), f"Missing asset: {fn}"
          assert '@tabler/core' in html and 'model-viewer' in html
          print('UI source and references validated')
          PY
