name: Verify Ionic student interface
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ui-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/nabd-ionic.js
      - name: Verify required UI files, elements and medical icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          js=Path('assets/nabd-ionic.js').read_text()
          icons=Path('assets/healthicons-anatomy.svg').read_text()
          required=[
            'assets/nabd-ionic.css',
            'assets/nabd-ionic.js',
            'assets/healthicons-anatomy.svg',
            'OPEN_SOURCE_SOURCES.md',
            'tabler-archive.html',
          ]
          for file in required:
              assert Path(file).is_file(),f'Missing: {file}'
          ids=set(re.findall(r'id="([^"]+)"',html))
          references=set(re.findall(r'\$\("([^"]+)"\)',js))
          assert not references-ids,f'Missing UI elements: {references-ids}'
          icon_symbols=set(re.findall(r'<symbol id="an-([^"]+)"',icons))
          for expected in ['nerve','skeleton','arm','intestine','lungs','kidneys','eye','ear','thyroid','dna']:
              assert expected in icon_symbols,f'Missing Health Icon: {expected}'
          assert '@ionic/core@9.0.8' in html and 'ion-tab-bar' in html
          assert 'model-viewer' in html and 'Ionicons' in html
          print('V9 static source and element checks passed')
          PY
