name: Verify NABD curriculum, exam bank and 3D simulations
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/nabd-ionic.js
          node --check assets/nabd-learn.js
          node --check assets/nabd-simulations.js
          node --check assets/nabd-exambank.js
          node --check assets/nabd-process.js
          node --check assets/nabd-ch1-audio.js
          node --check data/nabd-curriculum.js
      - name: Verify source links, 3D nucleus picking and lesson voice keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          data=Path('data/nabd-curriculum.js').read_text().split('window.NABD_CURRICULUM=',1)[1].rstrip().rstrip(';')
          curriculum=json.loads(data)
          assert len(curriculum['chapters'])==11
          assert sum(len(c['topics']) for c in curriculum['chapters'])==44
          jobs=json.loads(Path('data/NABD_B_44_VOICE_JOBS.json').read_text())
          expected={'nabd/lesson/{}/{}'.format(c['id'],i) for c in curriculum['chapters'] for i in range(4)}
          assert len(jobs['jobs'])==44
          assert {j['key'] for j in jobs['jobs']}==expected
          pages=[('learn.html','assets/nabd-learn.js'),('exam-bank.html','assets/nabd-exambank.js'),('simulations.html','assets/nabd-simulations.js')]
          for htmlpath,jspath in pages:
              h=Path(htmlpath).read_text()
              j=Path(jspath).read_text()
              ids=set(re.findall(r'id="([^"]+)"',h))
              refs=set(re.findall(r'\$\("([^"]+)"\)',j))
              assert not refs-ids,(htmlpath,refs-ids)
          process_js=Path('assets/nabd-process.js').read_text()
          assert 'const SYSTEMS=' in process_js
          assert process_js.count('"stages":')==11, 'Expected eleven chapter sequences'
          process_html=Path('simulations.html').read_text()
          assert 'assets/nabd-process.js' in process_html
          for required in ['process-title','process-current','process-choices','process-feedback','process-progress','process-restart']:
              assert ('id="'+required+'"') in process_html,required
          exam_html=Path('exam-bank.html').read_text()
          for required in ['manual-review','download-audit','question-text']:
              assert ('id="'+required+'"') in exam_html,required
          sim=Path('assets/nabd-simulations.js').read_text()
          assert 'target:"nucleus"' in sim and 'target:"soma"' in sim
          assert '"nucleus",-0.46' in sim and '"soma",-0.45' in sim
          assert 'ray.intersectObjects' in sim
          exam=Path('assets/nabd-exambank.js').read_text()
          assert 'NABD_PRIVATE_QUESTION_BANK_V1' in exam
          assert 'self_check_until_verified' in Path('data/nabd-curriculum.js').read_text() or 'تقييم ذاتي' in Path('exam-bank.html').read_text()
          assert 'window.speechSynthesis' not in Path('assets/nabd-learn.js').read_text()
          assert 'simulations.html' in Path('assets/nabd-ionic.js').read_text()
          assert 'exam-bank.html' in Path('assets/nabd-ionic.js').read_text()
          print('NABD source and question-bank UI checks passed')
          PY
