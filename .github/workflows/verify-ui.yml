name: Verify NABD curriculum, exam bank and 3D simulations
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/nabd-ionic.js
          node --check assets/nabd-learn.js
          node --check assets/nabd-simulations.js
          node --check assets/nabd-exambank.js
          node --check assets/nabd-process.js
          node --check assets/nabd-ch1-audio.js
          node --check assets/nabd-topic-challenges.js
          node --check data/nabd-curriculum.js
      - name: Verify source links, 3D nucleus picking and lesson voice keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          data=Path('data/nabd-curriculum.js').read_text().split('window.NABD_CURRICULUM=',1)[1].rstrip().rstrip(';')
          curriculum=json.loads(data)
          assert len(curriculum['chapters'])==11
          assert sum(len(c['topics']) for c in curriculum['chapters'])==44
          jobs=json.loads(Path('data/NABD_B_44_VOICE_JOBS.json').read_text())
          expected={'nabd/lesson/{}/{}'.format(c['id'],i) for c in curriculum['chapters'] for i in range(4)}
          assert len(jobs['jobs'])==44
          assert {j['key'] for j in jobs['jobs']}==expected
          pages=[('learn.html','assets/nabd-learn.js'),('exam-bank.html','assets/nabd-exambank.js'),('simulations.html','assets/nabd-simulations.js')]
          for htmlpath,jspath in pages:
              h=Path(htmlpath).read_text()
              j=Path(jspath).read_text()
              ids=set(re.findall(r'id="([^"]+)"',h))
              refs=set(re.findall(r'\$\("([^"]+)"\)',j))
              assert not refs-ids,(htmlpath,refs-ids)
          # Per-topic practice is not claimed to be a high-fidelity individual simulation.
          challenge=Path('assets/nabd-topic-challenges.js').read_text()
          assert '44 distinct source-linked exercises' in challenge
          assert 'nabd:topic-change' in challenge
          assert 'assets/nabd-topic-challenges.js' in Path('simulations.html').read_text()
          cover=json.loads(Path('data/NABD_44_TOPIC_3D_COVERAGE.json').read_text())
          assert cover['total']==44
          assert len(cover['topics'])==44
          v5=json.loads(Path('data/NABD_QBANK_V5_PUBLIC_AUDIT.json').read_text())
          assert v5['parent_candidate_question_records']==491
          assert v5['inline_answer_subparts_in_existing_parent_records']==13
          assert v5['source_image_reviewed_parent_questions_for_inline_answers']==3
          assert v5['answer_extraction_missing_count']==79
          assert v5['high_priority_review_count']==115
          assert v5['ministerial_year_and_round_question_links_verified']==0
          new_meta=json.loads(Path('data/NABD_QBANK_V5_2_PUBLIC_AUDIT.json').read_text())
          assert new_meta['original_candidate_records']==491
          assert new_meta['interactive_subparts_in_original_parent_records']==25
          assert new_meta['source_image_reviewed_compound_questions']==6
          assert new_meta['records_without_extracted_answer_or_visual_subparts']==76
          assert new_meta['suspicious_long_question_prompts_with_possible_embedded_answers']==54
          app_script=Path('assets/nabd-exambank.js').read_text()
          assert 'function unsafeQuestion' in app_script
          assert 'function showAuditPage' in app_script
          assert 'source-page-text' in app_script
          assert 'status==="unsafe"' in app_script
          exam_html=Path('exam-bank.html').read_text()
          assert 'id="unsafe-source-review"' in exam_html
          assert 'id="source-page-text"' in exam_html
          assert 'id="show-raw-question"' in exam_html
          assert 'inline-practice' in Path('exam-bank.html').read_text()
          exam_source=Path('assets/nabd-exambank.js').read_text()
          assert 'status==="inline"' in exam_source
          assert 'function renderInlineParts' in exam_source
          assert 'function refreshPageAudit' in exam_source
          assert 'function saveAuditPage' in exam_source
          assert 'function exportPageAudit' in exam_source
          assert 'if(!bookUrl)' in exam_source
          exam_html=Path('exam-bank.html').read_text()
          for name in ('inline-practice','audit-page','audit-page-filter','audit-page-note','audit-open-source','audit-mark-page','audit-export-pages'):
              assert ('id="'+name+'"') in exam_html, name
          assert "source_pdf_sha256" in exam_source

          assert 'function renderInlineParts' in Path('assets/nabd-exambank.js').read_text()
          assert 'pulseActive' in Path('assets/nabd-simulations.js').read_text()
          assert 'startPulse' in Path('assets/nabd-simulations.js').read_text()
          status=json.loads(Path('data/NABD_QBANK_V4_1_AUDIT_METADATA.json').read_text())
          assert status['question_candidates']==491
          assert status['unanswered_extraction_candidates']==82
          assert status['high_priority_editorial_review']==118
          assert status['ministerial_year_and_round_exact_question_links_certified']==0
          assert 'open-topic-lab' in Path('exam-bank.html').read_text()
          assert 'storeCorrection' in Path('assets/nabd-exambank.js').read_text()
          process_js=Path('assets/nabd-process.js').read_text()
          assert 'const SYSTEMS=' in process_js
          assert process_js.count('"stages":')==11, 'Expected eleven chapter sequences'
          process_html=Path('simulations.html').read_text()
          assert 'assets/nabd-process.js' in process_html
          for required in ['process-title','process-current','process-choices','process-feedback','process-progress','process-restart']:
              assert ('id="'+required+'"') in process_html,required
          exam_html=Path('exam-bank.html').read_text()
          for required in ['manual-review','download-audit','question-text']:
              assert ('id="'+required+'"') in exam_html,required
          sim=Path('assets/nabd-simulations.js').read_text()
          assert 'target:"nucleus"' in sim and 'target:"soma"' in sim
          assert '"nucleus",-0.46' in sim and '"soma",-0.45' in sim
          assert 'ray.intersectObjects' in sim
          exam=Path('assets/nabd-exambank.js').read_text()
          assert 'NABD_PRIVATE_QUESTION_BANK_V1' in exam
          assert 'self_check_until_verified' in Path('data/nabd-curriculum.js').read_text() or 'تقييم ذاتي' in Path('exam-bank.html').read_text()
          assert 'window.speechSynthesis' not in Path('assets/nabd-learn.js').read_text()
          assert 'simulations.html' in Path('assets/nabd-ionic.js').read_text()
          assert 'exam-bank.html' in Path('assets/nabd-ionic.js').read_text()
          print('NABD source and question-bank UI checks passed')
          PY
