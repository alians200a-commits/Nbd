name: Import licensed CC0 3D icons for NABD student UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-nabd-3d-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nabd-3d-asset-import
  cancel-in-progress: true
jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free image optimizer
        run: python -m pip install --quiet Pillow
      - name: Import, validate and optimize original Blender renders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,io,json,time
          from PIL import Image
          base='https://3dicons.sgp1.cdn.digitaloceanspaces.com/v1/dynamic/color/'
          names=['notebook','lab','file-text','file-fav','headphone','puzzle','trophy','calender','chart','bookmark-fav','folder','target','tick','bulb','medal','setting','chat','heart','mic','computer','rocket']
          root=Path('public/nabd-3d')
          root.mkdir(parents=True,exist_ok=True)
          verified=[]
          for name in names:
              url=base+name+'-dynamic-color.png'
              err=None
              for attempt in range(2):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; NABD CC0 asset renderer)'})
                      with urllib.request.urlopen(request,timeout=16) as response:
                          content=response.read(9000000)
                      if len(content)>8000000: raise ValueError('Image too large')
                      with Image.open(io.BytesIO(content)) as original:
                          if original.format!='PNG': raise ValueError('Unexpected upstream format')
                          image=original.convert('RGBA')
                          if image.width<64 or image.height<64: raise ValueError('Low-resolution artwork')
                          if image.getchannel('A').getextrema()[0]>=250: raise ValueError('Expected transparent background')
                          image.thumbnail((384,384),Image.Resampling.LANCZOS)
                          target=root/(name+'.webp')
                          image.save(target,'WEBP',quality=87,method=6,exact=True)
                          if target.stat().st_size>250000: raise ValueError('Optimized image still too big')
                          verified.append({'name':name,'file':target.name,'source':url,'width':image.width,'height':image.height,'bytes':target.stat().st_size})
                          print('OK',name,image.size,target.stat().st_size,flush=True)
                      break
                  except Exception as e:
                      err=e
                      time.sleep(1)
              else:
                  print('Skipping',name,err,flush=True)
          minimum={'notebook','lab','file-text','file-fav','headphone','puzzle','trophy','calender'}
          absent=minimum-set(r['name'] for r in verified)
          if absent: raise SystemExit('Required 3D assets unavailable: '+str(absent))
          (root/'sources.json').write_text(json.dumps({'author':'Vijay Verma, 3dicons V1','license':'CC0-1.0','repository':'https://github.com/realvjy/3dicons','description':'Original free Blender renders, converted to small transparent WebP. Motion uses CSS. No paid assets.','assets':verified},ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          PY
      - name: Publish CC0 artwork inside the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nabd-3d
          if ! git diff --cached --quiet; then
            git commit -m "Bundle genuine CC0 3Dicons as optimized transparent WebP for NABD"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
