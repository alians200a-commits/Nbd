<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نَبْض | مختبر الأحياء</title><style>body{margin:0;background:#071321;color:#e9f5f6;font:16px Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center}main{padding:25px}h1{color:#65e5dc}small{color:#b1c4cc}a{color:#70efda}</style><main><h1>نَبْض — مختبر الأحياء الذكي</h1><p id="state">جاري تحميل التطبيق…</p><small>نسخة تجريبية للنشر العام، بدون الكتب والصوت الخاص.</small><p><a href="atlas_real.html">فتح الأطلس التشريحي</a></p></main><script>(async()=>{try{const paths=Array.from({length:8},(_,i)=>"chunks/part"+String(i).padStart(3,"0")+".txt");const texts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw new Error(p+": "+r.status);return r.text()}));document.open();document.write(texts.join(""));document.close()}catch(e){document.getElementById("state").textContent="تعذر تحميل التطبيق: "+e.message;}})()</script></html>
